services:
  api:
    image: ${REGISTRY:-ghcr.io/openspell}/api:${IMAGE_TAG:-latest}
    build: null
    env_file:
      - .env

  web:
    image: ${REGISTRY:-ghcr.io/openspell}/web:${IMAGE_TAG:-latest}
    build: null
    env_file:
      - .env

  game:
    image: ${REGISTRY:-ghcr.io/openspell}/game:${IMAGE_TAG:-latest}
    build: null
    env_file:
      - .env

  chat:
    image: ${REGISTRY:-ghcr.io/openspell}/chat:${IMAGE_TAG:-latest}
    build: null
    env_file:
      - .env

  db-init:
    image: ${REGISTRY:-ghcr.io/openspell}/api:${IMAGE_TAG:-latest}
    build: null
    env_file:
      - .env
    command: ["sh", "-c", "pnpm -C packages/db prisma:migrate && pnpm -C packages/db prisma:seed"]
