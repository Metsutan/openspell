# --- Extension Fields (YAML Anchors) ---
x-game-env: &game_base_env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  API_URL: ${API_URL}
  CDN_URL: ${CDN_URL}
  HISCORES_UPDATE_SECRET: ${HISCORES_UPDATE_SECRET}
  JWT_SECRET: ${GAME_JWT_SECRET}
  CHAT_JWT_SECRET: ${CHAT_JWT_SECRET}
  TICK_MS: ${TICK_MS:-600}
  USE_HTTPS: ${USE_HTTPS:-false}
  SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/certs/localhost.pem}
  SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/certs/localhost-key.pem}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DISABLED: ${REDIS_DISABLED:-false}
  ASSET_SET: ${ASSET_SET:-base}
  STATIC_ASSETS_PATH: /app/apps/shared-assets/${ASSET_SET:-base}/static
  PACKET_TRACE_PATH: /data/game-logs/packets
  PORT: ${GAME_PORT:-8888}
  SERVER_URL: ${SERVER_URL:-http://localhost:${GAME_PORT:-8888}}
  PERSISTENCE_ID: ${PERSISTENCE_ID:-1}
  DISABLE_STAMINA: ${DISABLE_STAMINA:-false}

x-game-base: &game_base
  build:
    context: .
    dockerfile: apps/game/Dockerfile
  restart: unless-stopped
  stop_signal: SIGINT
  environment:
    <<: *game_base_env
  volumes:
    - openspell_game_logs:/data/game-logs
  depends_on:
    api:
      condition: service_started
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    cdn:
      condition: service_started
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  extra_hosts:
    - "localhost:host-gateway"
    - "api:host-gateway"
    - "web:host-gateway"
    - "cdn:host-gateway"
    - "postgres:host-gateway"
    - "redis:host-gateway"

services:
  env-init:
    image: node:20-slim
    container_name: openspell-env-init
    profiles:
      - init
    working_dir: /app
    environment:
      ENV_MODE: ${ENV_MODE:-dev}
    command: [ "sh", "-c", "node scripts/setup-env.js --mode=$ENV_MODE --write-docker-env --force" ]

  api:
    image: openspell-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: openspell-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      API_URL: ${API_URL}
      WEB_URL: ${WEB_URL}
      JWT_SECRET: ${API_JWT_SECRET}
      API_WEB_SECRET: ${API_WEB_SECRET}
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET}
      WORLD_REGISTRATION_SECRET: ${WORLD_REGISTRATION_SECRET}
      HISCORES_UPDATE_SECRET: ${HISCORES_UPDATE_SECRET}
      USE_HTTPS: ${USE_HTTPS:-false}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/certs/localhost.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/certs/localhost-key.pem}
      USING_REVERSE_PROXY: ${USING_REVERSE_PROXY:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DISABLED: ${REDIS_DISABLED:-false}
    extra_hosts:
      - "localhost:host-gateway"
      - "postgres:host-gateway"
      - "redis:host-gateway"
    ports:
      - "${API_PORT:-3002}:3002"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: openspell-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openspell-web
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-8887}
      NODE_ENV: ${NODE_ENV:-production}
      SESSION_SECRET: ${WEB_SESSION_SECRET}
      API_URL: ${API_URL}
      WEB_URL: ${WEB_URL}
      CDN_URL: ${CDN_URL}
      CHAT_URL: ${CHAT_URL}
      CLIENT_API_URL: ${CLIENT_API_URL}
      API_WEB_SECRET: ${API_WEB_SECRET}
      USE_HTTPS: ${USE_HTTPS:-false}
      ALLOW_INSECURE_HTTPS: ${ALLOW_INSECURE_HTTPS:-false}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/certs/localhost.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/certs/localhost-key.pem}
      ASSET_SET: ${ASSET_SET:-base}
      ASSETS_ROOT: /app/apps/shared-assets/${ASSET_SET:-base}
      USING_REVERSE_PROXY: ${USING_REVERSE_PROXY:-false}
    extra_hosts:
      - "localhost:host-gateway"
      - "api:host-gateway"
    ports:
      - "${WEB_PORT:-8887}:8887"
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # World 1 (Legacy)
  game:
    <<: *game_base
    image: openspell-game
    container_name: openspell-legacy
    environment:
      <<: *game_base_env
      SERVER_ID: 1
      SERVER_URL: http://localhost:8888
      PERSISTENCE_ID: 1
      MAX_CONNECTIONS: 2
    ports:
      - "${GAME_PORT:-8888}:8888"

  # World 2 (Custom)
  game-2:
    <<: *game_base
    image: openspell-game-2
    container_name: openspell-custom
    environment:
      <<: *game_base_env
      SERVER_ID: 2
      SERVER_URL: http://localhost:8889
      PERSISTENCE_ID: 2
      MAX_CONNECTIONS: 2
    ports:
      - "8889:8888"

  chat:
    image: openspell-chat
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    container_name: openspell-chat
    restart: unless-stopped
    environment:
      PORT: ${CHAT_PORT:-8765}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      CHAT_JWT_SECRET: ${CHAT_JWT_SECRET}
      USE_HTTPS: ${USE_HTTPS:-false}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/certs/localhost.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/certs/localhost-key.pem}
    extra_hosts:
      - "localhost:host-gateway"
      - "postgres:host-gateway"
    ports:
      - "${CHAT_PORT:-8765}:8765"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-init:
    image: openspell-db-init
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: openspell-db-init
    restart: "no"
    command: ["sh", "-c", "pnpm -C packages/db prisma:migrate && pnpm -C packages/db prisma:seed"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "localhost:host-gateway"
      - "postgres:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  postgres:
    image: postgres:16
    container_name: openspell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openspell
      POSTGRES_PASSWORD: openspell
      POSTGRES_DB: openspell
    ports:
      - "5432:5432"
    volumes:
      - openspell_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openspell -d openspell" ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: openspell-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass openspell
    ports:
      - "6379:6379"
    volumes:
      - openspell_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cdn:
    image: nginx:alpine
    container_name: openspell-cdn
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./apps/shared-assets/base:/usr/share/nginx/html:ro
      - ./deploy/nginx/cdn-local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "localhost:host-gateway"
      - "web:host-gateway"
      - "openspell-web:host-gateway"
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  openspell_pg_data:
  openspell_redis_data:
  openspell_game_logs:
